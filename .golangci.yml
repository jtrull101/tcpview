version: "2"

linters:
  default: standard
  enable:
    # SAST: Go security checks (hardcoded credentials, unsafe exec, weak crypto, file permissions, ...).
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      # Deferred Close() on a test double/fixture in test files is a very
      # common, intentionally-ignored error in this codebase's test suite
      # (fakes whose Close() can never meaningfully fail) - checking it
      # everywhere would be pure noise, not a real finding.
      - path: _test\.go
        linters:
          - errcheck
      # Tests build fixtures in t.TempDir(), so loose file modes (G301/G302/G306) and chmod games are fine;
      # their RNGs are seeded on purpose for reproducibility (G404); and they re-exec the test binary and
      # shell scripts as fake remotes (G204, G304). None of it touches untrusted input.
      - path: _test\.go
        linters:
          - gosec
