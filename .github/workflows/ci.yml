name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build
        run: go build -v ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned explicitly: "latest" has been observed resolving to a
          # release old enough to reject this module's go.mod "go"
          # directive outright ("Go language version used to build
          # golangci-lint is lower than the targeted Go version").
          version: v2.12.2

      - name: Test (race + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage gate (aggregate >= 90%, per-package floors)
        run: |
          set -o pipefail
          {
            echo "### Coverage"
            echo '```'
            sh scripts/coverage-gate.sh coverage.out
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: govulncheck
        # Pinned for the same reason as golangci-lint above: older
        # releases refuse this module's go directive.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Fuzz smoke tests
        run: |
          set -e
          go test ./internal/filter/... -run=^$ -fuzz=FuzzParseExpression -fuzztime=10s
          go test ./internal/filter/... -run=^$ -fuzz=FuzzFilterMatches -fuzztime=10s
          go test ./internal/capture/... -run=^$ -fuzz=FuzzDecode -fuzztime=10s
          go test ./internal/store/... -run=^$ -fuzz=FuzzReadArchiveFile -fuzztime=10s
          go test ./internal/remote/... -run=^$ -fuzz=FuzzParseTcpdumpList -fuzztime=10s
          go test . -run=^$ -fuzz=FuzzParseCapEff -fuzztime=10s

  test-macos:
    # The release builds darwin binaries too; without this, a Mac-only
    # failure would first surface when a release tag is pushed.
    name: test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install libpcap
        run: brew install libpcap

      - name: Test (race)
        run: go test ./... -race

  test-windows:
    # Release builds a Windows binary too. GitHub's Windows runners can't
    # have Npcap (its free edition has no unattended install), so tests
    # needing real capture skip and the missing-Npcap error path is
    # tested instead; everything else runs for real.
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: "0" # same as the release build; see release.yml
        run: go build -o tcpview.exe .

      - name: Test
        # Without -race: the race detector needs cgo, and this matches
        # the release's cgo-free Windows build. Linux and macOS run the
        # suite with -race.
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  static-build:
    # Exercises the release's Linux build path (static libpcap, see
    # .github/libpcap/build.sh) on every change, not just at release time.
    name: static Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build static libpcap
        run: |
          sudo apt-get update && sudo apt-get install -y flex bison
          .github/libpcap/build.sh "$RUNNER_TEMP/libpcap"

      - name: Build and check linkage
        env:
          CGO_ENABLED: "1"
        run: |
          export CGO_CFLAGS="-I$RUNNER_TEMP/libpcap/include" CGO_LDFLAGS="-L$RUNNER_TEMP/libpcap/lib"
          go build -o tcpview .
          ldd tcpview
          if ldd tcpview | grep -q libpcap; then
            echo "tcpview still links libpcap dynamically"; exit 1
          fi
          go test ./...
