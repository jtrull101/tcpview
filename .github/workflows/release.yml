name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows, so one set of steps serves every OS
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build static libpcap (Linux)
        # Linking the runner's shared libpcap tied the binary to Ubuntu's
        # libpcap.so.0.8 soname, so it failed to start on distros that only
        # ship libpcap.so.1 (e.g. Arch). See .github/libpcap/build.sh.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y flex bison
          .github/libpcap/build.sh "$RUNNER_TEMP/libpcap"
          echo "CGO_CFLAGS=-I$RUNNER_TEMP/libpcap/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$RUNNER_TEMP/libpcap/lib" >> "$GITHUB_ENV"

      - name: Install libpcap (macOS)
        if: runner.os == 'macOS'
        run: brew install libpcap

      - name: Sanity test
        run: go test ./...

      - name: Build
        env:
          # gopacket's Windows backend loads Npcap's wpcap.dll at runtime
          # instead of linking libpcap, so Windows needs no C toolchain.
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/tcpview${{ runner.os == 'Windows' && '.exe' || '' }}" .

      - name: Check libpcap is linked statically (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd dist/tcpview
          if ldd dist/tcpview | grep -q libpcap; then
            echo "dist/tcpview links libpcap dynamically"; exit 1
          fi

      - name: Package
        run: |
          name="tcpview-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/${name}"
          cp dist/tcpview* README.md LICENSE "pkg/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd pkg && 7z a -tzip "../${name}.zip" "${name}" >/dev/null)
          else
            tar -C pkg -czf "${name}.tar.gz" "${name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tcpview-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        # install.sh verifies downloads against this file.
        run: cd artifacts && sha256sum *.tar.gz *.zip | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS
